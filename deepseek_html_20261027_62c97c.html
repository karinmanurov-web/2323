<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированный Лисёнок (SVG)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Контейнер для SVG */
        .svg-container {
            width: 100%;
            max-width: 450px;
            height: auto;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
        }

        .svg-container svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Панель управления */
        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        #btn-start {
            background-color: #3DAA8C;
            box-shadow: 0 4px 15px rgba(61, 170, 140, 0.4);
        }
        #btn-start:hover { box-shadow: 0 6px 20px rgba(61, 170, 140, 0.6); }

        #btn-pause {
            background-color: #10304E;
            box-shadow: 0 4px 15px rgba(16, 48, 78, 0.4);
        }
        #btn-pause:hover { box-shadow: 0 6px 20px rgba(16, 48, 78, 0.6); }

        #btn-talk {
            background-color: #C85B17;
            box-shadow: 0 4px 15px rgba(200, 91, 23, 0.3);
        }
        #btn-talk:hover { box-shadow: 0 6px 20px rgba(200, 91, 23, 0.45); }

        /* --- FOX TEST ANIMATION v2 --- */

        /*
          The SVG contains several alternative drawing poses in the same file.
          Keep exactly one pose visible at a time; otherwise duplicate arms,
          mouths and brows overlap and make the character look broken.
        */
        #arms_pose_down,
        #arms_pose_point_left,
        #arms_pose_wave,
        #eyebrows_high,
        #eyebrows_low,
        #mouth_open,
        #mouth_surprised {
            display: none !important;
        }

        #arms_pose_default,
        #eyebrows_default,
        #mouth_neutral {
            display: inline;
        }

        /* Conversation mode switches only between neutral and open mouth.
           The surprised mouth stays hidden in this test version. */
        #mouth_open {
            display: none !important;
        }

        .talking #mouth_neutral,
        .talking #mouth_open {
            display: inline !important;
        }

        .talking #mouth_neutral {
            animation: foxTalkNeutral 1.05s steps(1, end) infinite;
        }

        .talking #mouth_open {
            animation: foxTalkOpen 1.05s steps(1, end) infinite;
        }

        @keyframes foxTalkNeutral {
            0%, 18%, 43%, 70%, 100% { opacity: 1; }
            19%, 42%, 71%, 99% { opacity: 0; }
        }

        @keyframes foxTalkOpen {
            0%, 18%, 43%, 70%, 100% { opacity: 0; }
            19%, 42%, 71%, 99% { opacity: 1; }
        }

        /* Stable resting face before the animation is started. */
        #mascot_eyes_open {
            opacity: 1;
            animation: none;
        }

        #eyes_closed {
            opacity: 0;
            animation: none;
        }

        /* All movement is paused until the Start button is pressed. */
        #mascot,
        #mascot_body,
        #mascot_head,
        #mascot_tail,
        #mascot_eyes_open,
        #eyes_closed {
            animation-play-state: paused;
        }

        /* A tiny whole-character float gives the idle animation some life. */
        #mascot {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: foxFloat 3.8s ease-in-out infinite;
        }

        @keyframes foxFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.45%); }
        }

        /* Subtle breathing; the lower edge stays almost anchored. */
        #mascot_body {
            transform-box: fill-box;
            transform-origin: 50% 100%;
            animation: foxBreathe 3.4s ease-in-out infinite;
        }

        @keyframes foxBreathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.006); }
        }

        /* A very small head nod, not a constant exaggerated bob. */
        #mascot_head {
            transform-box: fill-box;
            transform-origin: 50% 92%;
            animation: foxHeadIdle 4.6s ease-in-out infinite;
        }

        @keyframes foxHeadIdle {
            0%, 100% { transform: rotate(0deg); }
            45% { transform: rotate(-0.35deg); }
            70% { transform: rotate(0.15deg); }
        }

        /* Tail sways gently around the point where it joins the body. */
        #mascot_tail {
            transform-box: fill-box;
            transform-origin: 88% 82%;
            animation: foxTailSway 2.9s ease-in-out infinite;
        }

        @keyframes foxTailSway {
            0%, 100% { transform: rotate(0deg); }
            35% { transform: rotate(-1.8deg); }
            70% { transform: rotate(1.2deg); }
        }

        /* One quick blink every few seconds. No artificial talking animation. */
        #mascot_eyes_open {
            animation: foxEyesOpen 5.2s infinite;
        }

        #eyes_closed {
            animation: foxEyesClosed 5.2s infinite;
            opacity: 0;
        }

        @keyframes foxEyesOpen {
            0%, 91%, 95%, 100% { opacity: 1; }
            93% { opacity: 0; }
        }

        @keyframes foxEyesClosed {
            0%, 91%, 95%, 100% { opacity: 0; }
            93% { opacity: 1; }
        }

        .animating #mascot,
        .animating #mascot_body,
        .animating #mascot_head,
        .animating #mascot_tail,
        .animating #mascot_eyes_open,
        .animating #eyes_closed {
            animation-play-state: running;
        }

        @media (prefers-reduced-motion: reduce) {
            .animating #mascot,
            .animating #mascot_body,
            .animating #mascot_head,
            .animating #mascot_tail,
            .animating #mascot_eyes_open,
            .animating #eyes_closed {
                animation: none;
            }
        }

    </style>
</head>

    <div class="controls">
        <button id="btn-start">▶ Старт</button>
        <button id="btn-pause">⏸ Пауза</button>
        <button id="btn-talk" aria-pressed="false">💬 Разговор</button>
    </div>

    <script>
        const container = document.getElementById('fox-container');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnTalk = document.getElementById('btn-talk');
        const mouthNeutral = container.querySelector('#mouth_neutral');
        const mouthOpen = container.querySelector('#mouth_open');

        let talking = false;
        let talkTimer = null;
        let talkStep = 0;

        // Start / pause the character's gentle idle movement.
        btnStart.addEventListener('click', () => {
            container.classList.add('animating');
        });

        btnPause.addEventListener('click', () => {
            container.classList.remove('animating');
        });

        // Conversation mode: alternate neutral and open mouth with natural pauses.
        // The surprised mouth remains hidden throughout.
        const talkRhythm = [
            { mouth: 'open', duration: 150 },
            { mouth: 'neutral', duration: 170 },
            { mouth: 'open', duration: 130 },
            { mouth: 'neutral', duration: 560 },
            { mouth: 'open', duration: 170 },
            { mouth: 'neutral', duration: 650 }
        ];

        function setTalkMouth(mouth) {
            mouthNeutral.style.opacity = mouth === 'neutral' ? '1' : '0';
            mouthOpen.style.opacity = mouth === 'open' ? '1' : '0';
        }

        function runTalkRhythm() {
            if (!talking) return;
            const step = talkRhythm[talkStep % talkRhythm.length];
            setTalkMouth(step.mouth);
            talkStep += 1;
            talkTimer = window.setTimeout(runTalkRhythm, step.duration);
        }

        function stopTalking() {
            talking = false;
            window.clearTimeout(talkTimer);
            container.classList.remove('talking');
            btnTalk.setAttribute('aria-pressed', 'false');
            btnTalk.textContent = '💬 Разговор';
            mouthNeutral.style.opacity = '';
            mouthOpen.style.opacity = '';
            talkStep = 0;
        }

        btnTalk.addEventListener('click', () => {
            if (talking) {
                stopTalking();
                return;
            }

            talking = true;
            container.classList.add('talking');
            btnTalk.setAttribute('aria-pressed', 'true');
            btnTalk.textContent = '💬 Завершить разговор';
            talkStep = 0;
            runTalkRhythm();
        });
    </script>
